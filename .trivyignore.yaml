# Findings that are by design, each scoped to one file (gha-common trivy-config's trivyignores input). Re-check before expired_at.
misconfigurations:
  # The apps Argo CD deploys k3s-apps: it must create and change Deployments, CronJobs, ConfigMaps, Services and
  # NetworkPolicies in apps, auth and monitoring. Changes are limited to named objects; it has no rule on Secrets,
  # RBAC or PVs (README, "RBAC"). Live since 2026-11-14 as Terraform; flagged once the Roles became a Helm chart.
  - id: KSV-0048
    paths:
      - "platform/rbac/argocd-apps/templates/roles.yaml"
    statement: "The apps Argo CD's controller manages k3s-apps' Deployments and CronJobs by name (ADR 0031, 0037)."
    expired_at: 2027-11-30
  - id: KSV-0049
    paths:
      - "platform/rbac/argocd-apps/templates/roles.yaml"
    statement: "The apps Argo CD's controller manages k3s-apps' ConfigMaps by name (ADR 0031, 0037)."
    expired_at: 2027-11-30
  - id: KSV-0056
    paths:
      - "platform/rbac/argocd-apps/templates/roles.yaml"
    statement: "The apps Argo CD's controller manages k3s-apps' Services and NetworkPolicies by name (ADR 0031, 0037)."
    expired_at: 2027-11-30
  # node-exporter reports the node's own stats to the homeserver's Prometheus: it needs the host's network, PID
  # namespace and read-only /, /proc and /sys, and a host port. That is why its namespace alone stays privileged
  # (README, "Namespaces"). Flagged once the DaemonSet moved from Terraform to platform/ (stage 5b).
  - id: KSV-0009
    paths:
      - "platform/node-exporter/daemonset.yaml"
    statement: "node-exporter needs hostNetwork for real node stats and direct scraping from the homeserver."
    expired_at: 2027-11-30
  - id: KSV-0010
    paths:
      - "platform/node-exporter/daemonset.yaml"
    statement: "node-exporter needs hostPID to see the node's processes."
    expired_at: 2027-11-30
  - id: KSV-0023
    paths:
      - "platform/node-exporter/daemonset.yaml"
    statement: "node-exporter reads /, /proc and /sys of the node, mounted read-only."
    expired_at: 2027-11-30
  - id: KSV-0121
    paths:
      - "platform/node-exporter/daemonset.yaml"
    statement: "node-exporter reads /, /proc and /sys of the node, mounted read-only."
    expired_at: 2027-11-30
  - id: KSV-0024
    paths:
      - "platform/node-exporter/daemonset.yaml"
    statement: "Port 9100 on each node is the homeserver Prometheus' scrape target."
    expired_at: 2027-11-30
  - id: KSV-0125
    paths:
      - "platform/node-exporter/daemonset.yaml"
    statement: "Same digest-pinned prom/node-exporter image as home-infra's node_exporter, so metric names never diverge."
    expired_at: 2027-11-30
