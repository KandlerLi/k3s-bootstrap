name: Security scan

# GitHub-hosted: this repo has no self-hosted runner by design (home-infra-docs decisions.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trivy-config:
    uses: KandlerLi/gha-common/.github/workflows/trivy-config.yml@v0.0.9
    with:
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read

  gitleaks:
    uses: KandlerLi/gha-common/.github/workflows/gitleaks.yml@v0.0.12
    permissions:
      contents: read
