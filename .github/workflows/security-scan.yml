name: Security scan

# GitHub-hosted: this repo has no self-hosted runner by design (home-infra-docs decisions.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly: new CVEs in unchanged images, see trivy-image below.
  schedule:
    - cron: "23 5 * * 1"

jobs:
  trivy-config:
    uses: KandlerLi/gha-common/.github/workflows/trivy-config.yml@v0.0.17
    with:
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read

  # Informational on PR/push; the weekly run fails on fixable CRITICALs, which GitHub emails about.
  trivy-image:
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with modules/github_runner/arc.tf.
        include:
          - name: dind
            ref: docker:29.9.3-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
          - name: github-runner
            ref: myoung34/github-runner:2.338.2-debian-trixie@sha256:ac2f72d1a1e20a62452a9bcb11488d880adacc2ad72786e920ebc3ba264cd0a4
          - name: arc-controller
            ref: ghcr.io/actions/gha-runner-scale-set-controller:0.15.1@sha256:4b51a20db717b194e2f3fa96cfe2ddcb21602811f79053c75fd1a383517b9f90
    uses: KandlerLi/gha-common/.github/workflows/trivy-image.yml@v0.0.17
    with:
      image_name: ${{ matrix.name }}
      image_ref: ${{ matrix.ref }}
      fail_on_severity: ${{ github.event_name == 'schedule' && 'CRITICAL' || '' }}
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read
      packages: read

  gitleaks:
    uses: KandlerLi/gha-common/.github/workflows/gitleaks.yml@v0.0.17
    permissions:
      contents: read
