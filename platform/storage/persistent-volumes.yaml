# Statically provisioned PVs, Retain everywhere: they point at real data (NFS on the homeserver's black and red HDDs,
# host paths on k3s-node-1/-3). Each claimRef names its claim, so a released PV only binds back to it. Never pruned or
# deleted by Argo CD (annotation per object). Generated 2026-11-28 from the live objects; see README, "Storage".
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authelia-backup-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  nfs:
    path: /mnt/red-hdd/authelia-backup
    server: 192.168.101.1
  claimRef:
    namespace: auth
    name: authelia-backup
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: blocky-postgres-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 256Mi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /var/lib/k3s-apps-data/blocky-postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3s-node-1
  claimRef:
    namespace: apps
    name: blocky-postgres
---
