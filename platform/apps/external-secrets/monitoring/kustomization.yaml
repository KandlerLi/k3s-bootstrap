apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
nameSuffix: -monitoring
patches:
  - target:
      kind: Application
    patch: |-
      - op: replace
        path: /spec/destination/namespace
        value: monitoring
      - op: replace
        path: /spec/source/helm/valuesObject/scopedNamespace
        value: monitoring
      - op: replace
        path: /spec/source/helm/valuesObject/extraObjects/0/metadata/namespace
        value: monitoring
